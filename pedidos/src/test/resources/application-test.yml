spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
gateway:
  secret: test-gateway-secret
eureka:
  client:
    enabled: false

management:
  statsd:
    metrics:
      export:
        enabled: false
