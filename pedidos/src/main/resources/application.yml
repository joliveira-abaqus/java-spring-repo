spring:
  application:
    name: pedidos-ms
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/alurafood-pedidos?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    show-sql: true
  flyway:
    enabled: true
server:
  port: 0
gateway:
  secret: ${GATEWAY_SECRET}
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8081/eureka

# Monitoramento: exporta metricas ao DogStatsD do Datadog Agent local
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  statsd:
    metrics:
      export:
        enabled: true
        flavor: datadog
        host: ${DD_AGENT_HOST:localhost}
        port: 8125
  metrics:
    tags:
      service: ${spring.application.name}
