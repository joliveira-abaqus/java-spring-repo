spring:
  application:
    name: server
server:
  port: 8081
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

# Monitoramento: exporta metricas ao DogStatsD do Datadog Agent local
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  statsd:
    metrics:
      export:
        enabled: true
        flavor: datadog
        host: ${DD_AGENT_HOST:localhost}
        port: 8125
  metrics:
    tags:
      service: ${spring.application.name}
