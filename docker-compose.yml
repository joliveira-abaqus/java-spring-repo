services:

  mysql-pagamentos:
    image: mysql:8.0
    container_name: mysql-pagamentos
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: alurafood-pagamento
    ports:
      - "3306:3306"
    volumes:
      - mysql-pagamentos-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: always

  mysql-pedidos:
    image: mysql:8.0
    container_name: mysql-pedidos
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: alurafood-pedidos
    ports:
      - "3307:3306"
    volumes:
      - mysql-pedidos-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: always

  mysql-auth:
    image: mysql:8.0
    container_name: mysql-auth
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: alurafood-auth
    ports:
      - "3308:3306"
    volumes:
      - mysql-auth-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: always

  server:
    build: ./server
    container_name: eureka-server
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: always

  auth:
    build: ./auth
    container_name: auth-ms
    ports:
      - "8085:8085"
    restart: always
    depends_on:
      server:
        condition: service_healthy
      mysql-auth:
        condition: service_healthy
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-auth:3306/alurafood-auth?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://server:8081/eureka
      JWT_SECRET: ${JWT_SECRET:-YWx1cmFmb29kLXNlY3JldC1rZXktand0LXNlY3VyaXR5LTI1Ni1iaXRzLW1pbmltdW0=}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8085"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  gateway:
    build: ./gateway
    container_name: api-gateway
    ports:
      - "8082:8082"
    restart: always
    depends_on:
      server:
        condition: service_healthy
      auth:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://server:8081/eureka
      JWT_SECRET: ${JWT_SECRET:-YWx1cmFmb29kLXNlY3JldC1rZXktand0LXNlY3VyaXR5LTI1Ni1iaXRzLW1pbmltdW0=}
      GATEWAY_SECRET: ${GATEWAY_SECRET:-alurafood-gateway-local-dev-secret}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8082"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  pagamentos:
    build: ./pagamentos
    container_name: pagamentos-ms
    expose:
      - "8083"
    restart: always
    depends_on:
      gateway:
        condition: service_healthy
      mysql-pagamentos:
        condition: service_healthy
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-pagamentos:3306/alurafood-pagamento?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://server:8081/eureka
      GATEWAY_SECRET: ${GATEWAY_SECRET:-alurafood-gateway-local-dev-secret}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8083"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  pedidos:
    build: ./pedidos
    container_name: pedidos-ms
    expose:
      - "8084"
    restart: always
    depends_on:
      gateway:
        condition: service_healthy
      mysql-pedidos:
        condition: service_healthy
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-pedidos:3306/alurafood-pedidos?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://server:8081/eureka
      GATEWAY_SECRET: ${GATEWAY_SECRET:-alurafood-gateway-local-dev-secret}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8084"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  mysql-pagamentos-data:
  mysql-pedidos-data:
  mysql-auth-data:
