services:
  mysql-pagamentos:
    image: mysql:8.0
    container_name: mysql-pagamentos
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: alurafood-pagamento
    ports:
      - "3306:3306"
    volumes:
      - mysql-pagamentos-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-pedidos:
    image: mysql:8.0
    container_name: mysql-pedidos
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: alurafood-pedidos
    ports:
      - "3307:3306"
    volumes:
      - mysql-pedidos-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: eureka-server
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  gateway:
    build: ./gateway
    container_name: api-gateway
    ports:
      - "8082:8082"
    depends_on:
      server:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://server:8081/eureka

  pagamentos:
    build: ./pagamentos
    container_name: pagamentos-ms
    ports:
      - "8083:8083"
    depends_on:
      server:
        condition: service_healthy
      mysql-pagamentos:
        condition: service_healthy
    environment:
      SERVER_PORT: "8083"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-pagamentos:3306/alurafood-pagamento?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://server:8081/eureka

  pedidos:
    build: ./pedidos
    container_name: pedidos-ms
    ports:
      - "8084:8084"
    depends_on:
      server:
        condition: service_healthy
      mysql-pedidos:
        condition: service_healthy
    environment:
      SERVER_PORT: "8084"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-pedidos:3306/alurafood-pedidos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://server:8081/eureka

volumes:
  mysql-pagamentos-data:
  mysql-pedidos-data:
