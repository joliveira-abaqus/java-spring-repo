services:

  mysql-pagamentos:
    image: mysql:8.0
    container_name: mysql-pagamentos
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: alurafood-pagamento
    ports:
      - "3306:3306"
    volumes:
      - mysql-pagamentos-data:/var/lib/mysql
    restart: always

  mysql-pedidos:
    image: mysql:8.0
    container_name: mysql-pedidos
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: alurafood-pedidos
    ports:
      - "3307:3306"
    volumes:
      - mysql-pedidos-data:/var/lib/mysql
    restart: always

  mysql-auth:
    image: mysql:8.0
    container_name: mysql-auth
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: alurafood-auth
    ports:
      - "3308:3306"
    volumes:
      - mysql-auth-data:/var/lib/mysql
    restart: always

  server:
    build: ./server
    container_name: eureka-server
    ports:
      - "8081:8081"
    restart: always

  auth:
    build: ./auth
    container_name: auth-ms
    ports:
      - "8085:8085"
    restart: always
    depends_on:
      - server
      - mysql-auth
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-auth:3306/alurafood-auth?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://server:8081/eureka
      JWT_SECRET: ${JWT_SECRET:-YWx1cmFmb29kLXNlY3JldC1rZXktand0LXNlY3VyaXR5LTI1Ni1iaXRzLW1pbmltdW0=}

  gateway:
    build: ./gateway
    container_name: api-gateway
    ports:
      - "8082:8082"
    restart: always
    depends_on:
      - server
      - auth
    environment:
      SERVER_PORT: 8082
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://server:8081/eureka
      JWT_SECRET: ${JWT_SECRET:-YWx1cmFmb29kLXNlY3JldC1rZXktand0LXNlY3VyaXR5LTI1Ni1iaXRzLW1pbmltdW0=}
      GATEWAY_SECRET: ${GATEWAY_SECRET}

  pagamentos:
    build: ./pagamentos
    container_name: pagamentos-ms
    expose:
      - "8083"
    restart: always
    depends_on:
      - gateway
      - mysql-pagamentos
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-pagamentos:3306/alurafood-pagamento?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://server:8081/eureka
      GATEWAY_SECRET: ${GATEWAY_SECRET}

  pedidos:
    build: ./pedidos
    container_name: pedidos-ms
    expose:
      - "8084"
    restart: always
    depends_on:
      - gateway
      - mysql-pedidos
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-pedidos:3306/alurafood-pedidos?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://server:8081/eureka
      GATEWAY_SECRET: ${GATEWAY_SECRET}

volumes:
  mysql-pagamentos-data:
  mysql-pedidos-data:
  mysql-auth-data:
