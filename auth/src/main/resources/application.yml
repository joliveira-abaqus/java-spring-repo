spring:
  application:
    name: auth-ms
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/alurafood-auth?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    show-sql: true
  flyway:
    enabled: true
server:
  port: 8085
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8081/eureka
jwt:
  secret: ${JWT_SECRET:YWx1cmFmb29kLXNlY3JldC1rZXktand0LXNlY3VyaXR5LTI1Ni1iaXRzLW1pbmltdW0=}
  expiration: 86400000
